
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professor Life Simulator</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#111827;color:white;
font-family:system-ui,sans-serif;text-align:center;
}
main{max-width:960px;margin:auto;padding:12px}
h1{font-size:24px;margin:10px}
small{color:#94a3b8;letter-spacing:3px}
canvas{
width:100%;display:block;border-radius:16px;
background:#dbeafe;touch-action:none;
}
#stats{
display:grid;grid-template-columns:repeat(3,1fr);
gap:8px;margin:12px 0;
}
.stat{background:#1e293b;padding:10px;border-radius:10px}
.bar{height:8px;background:#475569;border-radius:8px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:#4ade80;transition:width .3s}
button{
border:0;border-radius:12px;background:#facc15;
color:#172033;font-size:16px;font-weight:bold;
padding:14px 20px;cursor:pointer;
touch-action:manipulation;
}
button:active{transform:scale(.95)}
#actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}
#dialog{background:#1e293b;border-radius:12px;padding:15px;margin-top:10px;min-height:90px}
#time{color:#facc15;font-size:22px;font-weight:bold}
#progress{color:#94a3b8;font-size:14px;margin:10px}
</style>
</head>
<body>
<main>
<small>PROFESSOR LIFE SIMULATOR</small>
<h1>教授的一天</h1>
<div id="time">07:50</div>
<div id="stats">
<div class="stat">體力 <span id="energyText">100</span>
<div class="bar"><div class="fill" id="energy"></div></div></div>
<div class="stat">工作 <span id="workText">0</span>
<div class="bar"><div class="fill" id="work"></div></div></div>
<div class="stat">幸福 <span id="happyText">50</span>
<div class="bar"><div class="fill" id="happy"></div></div></div>
</div>
<canvas id="game" width="800" height="450"></canvas>
<div id="progress"></div>
<div id="dialog"></div>
<div id="actions"></div>
</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const face=new Image();

// 教授真實照片，直接內嵌
face.src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABIMDRANCxIQDhAUExIVGywdGxgYGzYnKSAsQDlEQz85Pj1HUGZXR0thTT0+WXlaYWltcnNyRVV9hnxvhWZwcm7/2wBDARMUFBsXGzQdHTRuST5Jbm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm7/wAARCABAACwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDoazLnWoY2KQL5rDqc4UVH4hvGjhFtETvk5bHp/wDXqvptmqKpcbm7+lOc+UVOnzEi6tdu3yQ7h7LxVmLWI9wW5RoWPqOKuxxccCm3NmksZWRQQayVVmrpRJlIZQykEHoRS1i2ss1hd+Q7brbsT1ArarojJSV0c8ouLszA1ZhJqEgxym0Z/D/69Ftf20RCySgHpgc1HrI8zU3EbdMBseuOlQ2dpIr7k2qM85jDZrCdm9Top3S0Oljni8reG+Wq7azaFygMm73QiqVtGzidgW2Kw+QHAx34pwsZtzkyuUPRSAVNZ6GhJexrMiyRnIHp3FaUbb41YdCAayJbZ2AKMEbgA4zmtW2INumAQAMc+1bUn0MKye5haxGY9TZgMCRQ2fccVNHMvkZBJOOgOKv6nZ/aoQVOHjyR7+1YTFvKKwsFcc89DUVFqaUpXRd0+6mUyIlq7ZPBJxn8a0c+UQzJlT+lZNjcTbcNOik+3SryCT78su9fQDAqGjUnkYSyowHy5q4owoAFVIGE1x8v3UHP1q5W1JaXOatLWwVz2qxrDqBMeOQGx6GpbzxPaQkrbq07DuOF/OqFwZphbX8nK3CYbHQEH/CqqbE09yxDLaghnjAarb3nngRQLgdzVK2hikb5utb+naeoUSum1Oy4+9/9aue1zpbsrsrhk0uCAy4CTuQWPY9s1erF8YThpYbcHO0Fm/Hp/Ksy31a8toRFHIpVem5c4rrjHQ5Jau5//9k=";

let scene=-1;
let energy=100,work=0,happy=50;
let teaching=0,research=0,swim=0;
let homeStep=0;
let frame=0;
let particles=[];
let lastStroke=0;
let researchTarget=-1;
let researchDone=false;

const questions=[
{
q:"學生：老師，如何在 JavaScript 宣告變數？",
a:["let","print","repeat"],correct:0
},
{
q:"學生：哪個指令可以輸出訊息到 Console？",
a:["draw()","console.log()","input()"],correct:1
},
{
q:"學生：哪一個運算子用於嚴格相等比較？",
a:["=","+=","==="],correct:2
},
{
q:"學生：哪一個關鍵字可以建立迴圈？",
a:["for","return","const"],correct:0
},
{
q:"學生：JavaScript 陣列的第一個索引是？",
a:["1","0","-1"],correct:1
}
];

function rect(x,y,w,h,color){
ctx.fillStyle=color;
ctx.fillRect(x,y,w,h);
}

function circle(x,y,r,color){
ctx.fillStyle=color;
ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.fill();
}

function text(t,x,y,size=20,color="white",align="left"){
ctx.fillStyle=color;
ctx.font=`bold ${size}px system-ui`;
ctx.textAlign=align;
ctx.fillText(t,x,y);
}

function dialog(t){
document.getElementById("dialog").textContent=t;
}

function buttons(items){
const box=document.getElementById("actions");
box.replaceChildren();
items.forEach(([name,fn])=>{
let b=document.createElement("button");
b.textContent=name;
b.onclick=fn;
box.appendChild(b);
});
}

function time(t){
document.getElementById("time").textContent=t;
}

function progress(t){
document.getElementById("progress").textContent=t;
}

function stats(){
energy=Math.max(0,Math.min(100,energy));
work=Math.max(0,Math.min(100,work));
happy=Math.max(0,Math.min(100,happy));

for(let [id,value] of [
["energy",energy],["work",work],["happy",happy]
]){
document.getElementById(id).style.width=value+"%";
document.getElementById(id+"Text").textContent=value;
}
}

function sparkle(x,y){
for(let i=0;i<18;i++){
particles.push({
x,y,vx:(Math.random()-.5)*7,
vy:-Math.random()*6,
life:40
});
}
}

// 教授角色
function professor(x,y,scale=1,swimming=false){
ctx.save();
ctx.translate(x,y);
ctx.scale(scale,scale);

let bob=Math.sin(frame*.06)*2;
ctx.translate(0,bob);

if(swimming){
rect(10,10,95,32,"#38bdf8");
rect(85,15,45,10,"#d7a27c");
rect(85,33,45,10,"#d7a27c");
ctx.save();
ctx.rotate(Math.sin(frame*.12)*.6);
rect(10,20,65,12,"#e9b48d");
ctx.restore();
}else{
rect(-29,30,58,65,"#23395d");
rect(-9,30,18,48,"#ffffff");
rect(-40,34,12,45,"#23395d");
rect(28,34,12,45,"#23395d");
rect(-23,95,19,35,"#263244");
rect(4,95,19,35,"#263244");
rect(-27,125,25,10,"#111827");
rect(4,125,25,10,"#111827");
}

ctx.save();
ctx.beginPath();
ctx.ellipse(0,0,38,45,0,0,Math.PI*2);
ctx.clip();
if(face.complete&&face.naturalWidth){
ctx.drawImage(face,-38,-45,76,90);
}else{
rect(-38,-45,76,90,"#d7a27c");
}
ctx.restore();
ctx.restore();
}

// 電腦
function computer(x,y){
rect(x,y,85,55,"#263244");
rect(x+5,y+5,75,45,"#101827");
for(let i=0;i<4;i++){
rect(x+12,y+12+i*8,25+i*7,3,
i%2?"#4ade80":"#60a5fa");
}
rect(x+36,y+55,13,14,"#475569");
rect(x+20,y+69,45,5,"#334155");
}

// 教室
function classroom(){
rect(0,0,800,450,"#e8e4d8");
rect(0,320,800,130,"#a68d72");
rect(30,35,470,180,"#795d40");
rect(40,45,450,160,"#245b4d");

text("PROGRAMMING 101",65,80,24);
text("let knowledge = 100;",65,120,20,"#bbf7d0");
text("console.log('Hello!');",65,155,20,"#fde68a");
text("Learn • Create • Explore",65,185,15);

rect(565,35,200,180,"#94d8ff");
rect(660,35,7,180,"#ffffff");
rect(565,120,200,7,"#ffffff");

professor(590,240,1.05);

for(let i=0;i<3;i++){
let x=65+i*175;
rect(x,350,150,14,"#805b3c");
rect(x+8,364,12,86,"#65482f");
rect(x+130,364,12,86,"#65482f");
circle(x+70,310,24,"#d7a27c");
rect(x+43,331,54,55,["#64748b","#a78bfa","#60a5fa"][i]);
computer(x+28,280);
}

text("教學進度 "+teaching+"/5",20,28,19,"#334155");
}

// 辦公室
function office(){
rect(0,0,800,450,"#d9d3c5");
rect(0,335,800,115,"#967a60");

rect(40,40,170,280,"#79583b");
for(let j=0;j<4;j++){
rect(40,105+j*65,170,7,"#513b29");
for(let i=0;i<7;i++){
rect(48+i*22,55+j*65,17,50,
["#2563eb","#dc684c","#d6ae54","#518b77"][i%4]);
}
}

rect(510,35,240,160,"#9ed8f3");
rect(625,35,7,160,"white");
rect(510,110,240,7,"white");

professor(390,235,1);

rect(260,330,450,20,"#805b3c");
rect(280,350,18,100,"#65482f");
rect(680,350,18,100,"#65482f");

computer(480,250);
rect(585,310,70,18,"#f5f5f4");

text("RESEARCH LAB",250,65,25,"#334155");
text("研究進度 "+research+"%",250,100,20,"#334155");

rect(250,120,260,15,"#b4b0a6");
rect(250,120,260*research/100,15,"#22c55e");

if(researchTarget>=0&&!researchDone){
let x=270+researchTarget*100;
rect(x,155,65,55,"#facc15");
text("資料",x+32,188,17,"#172033","center");
}
}

// 游泳池
function pool(){
rect(0,0,800,450,"#dce6eb");
rect(0,0,800,70,"#b0d6e8");

text("SWIMMING POOL",400,45,26,"#164e63","center");

rect(25,90,750,320,"#e8e8e8");
rect(45,110,710,280,"#168dc6");

for(let i=0;i<3;i++){
rect(45,180+i*70,710,3,"#ffffff");
for(let j=0;j<35;j++){
circle(50+j*20,180+i*70,5,
j%2?"#ffffff":"#ef4444");
}
}

for(let i=0;i<25;i++){
let x=(i*73+frame*.6)%700+45;
let y=120+(i*47)%260;
rect(x,y,25,2,"#7dd3fc");
}

let x=90+swim*5.5;
professor(x,235,.8,true);

if(Date.now()-lastStroke<300){
for(let i=0;i<6;i++){
circle(x-30-i*9,260+Math.sin(frame+i)*10,
3+i%3,"#bae6fd");
}
}

rect(60,420,680,12,"#64748b");
rect(60,420,680*swim/100,12,"#22c55e");
text(swim+" / 100 m",400,405,18,"#164e63","center");
}

// 家中
function home(){
rect(0,0,800,450,"#e6cdb1");
rect(0,330,800,120,"#947054");

rect(45,40,220,180,"#443d35");
rect(53,48,204,164,"#18274a");
circle(200,85,27,"#fff0b0");

for(let i=0;i<12;i++){
circle(65+i*15,65+(i*37)%120,2,"white");
}

rect(350,210,280,110,"#64748b");
rect(330,260,320,75,"#64748b");
rect(350,290,280,45,"#475569");
rect(330,250,35,90,"#475569");
rect(615,250,35,90,"#475569");

rect(60,260,180,100,"#79583b");
rect(75,190,150,90,"#111827");
rect(82,197,136,76,"#2563eb");
text("TV",150,245,25,"white","center");

rect(310,365,280,45,"#b88c6a");

if(homeStep>=3){
rect(300,270,380,110,"#64748b");
rect(310,275,90,60,"#f1f5f9");
ctx.save();
ctx.translate(365,315);
ctx.rotate(-Math.PI/2);
professor(0,0,.7);
ctx.restore();
rect(410,280,255,90,"#60a5fa");
text("Z z z",550,230,30,"#475569");
}else{
professor(480,235,.9);
}

text("HOME SWEET HOME",400,35,23,"#65482f","center");
}

// 開始畫面
function menu(){
let grad=ctx.createLinearGradient(0,0,0,450);
grad.addColorStop(0,"#1e3a5f");
grad.addColorStop(1,"#101827");
ctx.fillStyle=grad;
ctx.fillRect(0,0,800,450);

circle(400,150,100,"#334e70");
professor(400,125,1.45);

text("PROFESSOR LIFE",400,360,39,"#facc15","center");
text("教授的一天",400,405,28,"white","center");
}

function startGame(){
energy=100;
work=0;
happy=50;
teaching=0;
research=0;
swim=0;
homeStep=0;
researchDone=false;
scene=0;
time("08:00");
progress("CHAPTER 01 / 04");
showQuestion();
stats();
}

// 第一關：程式設計
function showQuestion(){
if(teaching>=questions.length){
time("12:00");
dialog("上午的程式設計課順利結束！");
buttons([["前往辦公室 →",startOffice]]);
return;
}

const q=questions[teaching];
dialog(q.q);

buttons(q.a.map((answer,i)=>[
answer,()=>{
energy-=4;
if(i===q.correct){
work+=10;
happy+=3;
dialog("回答正確！學生成功理解程式概念。");
sparkle(590,220);
}else{
work+=3;
dialog("正確答案是 "+q.a[q.correct]+"，再接再厲！");
}
teaching++;
stats();
buttons([["下一位學生 →",showQuestion]]);
}
]));
}

// 第二關：研究資料
function startOffice(){
scene=1;
energy+=15;
time("13:00");
progress("CHAPTER 02 / 04");
researchRound();
stats();
}

function researchRound(){
if(research>=100){
researchTarget=-1;
time("17:00");
dialog("研究工作完成！辛苦了一天，準備去游泳。");
buttons([["前往游泳池 →",startPool]]);
return;
}

researchTarget=Math.floor(Math.random()*4);
researchDone=false;

dialog("找出畫面中黃色的研究資料，選擇正確的位置。");

buttons([0,1,2,3].map(i=>[
"資料 "+(i+1),()=>{
if(i===researchTarget){
research+=20;
work+=10;
energy-=5;
researchDone=true;
sparkle(400,170);
dialog("成功整理研究資料！");
stats();
buttons([["繼續研究",researchRound]]);
}else{
energy-=2;
dialog("找錯資料了，再試一次！");
stats();
}
}
]));
}

// 第三關：游泳
function startPool(){
scene=2;
time("17:30");
progress("CHAPTER 03 / 04");
dialog("連續點擊划水按鈕，完成100公尺游泳挑戰！");
buttons([["🏊 划水！",stroke]]);
}

function stroke(){
if(scene!==2||swim>=100)return;
swim=Math.min(100,swim+4);
lastStroke=Date.now();

if(swim%20===0){
energy-=3;
happy+=5;
}

stats();

if(swim>=100){
sparkle(650,200);
dialog("完成100公尺！運動後心情真好。");
buttons([["回家休息 →",startHome]]);
}
}

document.addEventListener("keydown",e=>{
if(e.code==="Space"&&scene===2){
e.preventDefault();
if(!e.repeat)stroke();
}
});

// 第四關：回家
function startHome(){
scene=3;
time("19:30");
progress("CHAPTER 04 / 04");
dialog("終於回到家了！先享用美味的晚餐吧。");

buttons([["🍚 吃晚餐",()=>{
homeStep=1;
energy+=25;
happy+=10;
time("20:00");
stats();
dialog("晚餐吃飽了，接下來放鬆一下。");

buttons([["📺 看電視",()=>{
homeStep=2;
happy+=10;
time("21:30");
stats();
dialog("忙碌的一天即將結束，準備睡覺。");

buttons([["🛏️ 上床睡覺",()=>{
homeStep=3;
energy=100;
happy+=5;
time("23:00");
stats();
dialog("晚安，教授！");

buttons([["查看今日成果",finish]]);
}]);

}]);

}]);
}

// 結算
function finish(){
scene=4;
let score=Math.round((energy+work+happy)/3);
progress("DAY COMPLETE");
dialog("今日綜合評分："+score+" / 100");
buttons([["重新開始新的一天",startGame]]);
}

function ending(){
rect(0,0,800,450,"#172b45");

professor(400,105,1.2);

text("DAY COMPLETE!",400,295,36,"#facc15","center");
text("辛苦了，教授！",400,340,28,"white","center");
text("教學完成 "+teaching+"/5",170,395,19,"#93c5fd","center");
text("研究 "+research+"%",400,395,19,"#86efac","center");
text("游泳 "+swim+"m",630,395,19,"#fde68a","center");
}

// 主迴圈
function loop(){
frame++;

if(scene===-1)menu();
if(scene===0)classroom();
if(scene===1)office();
if(scene===2)pool();
if(scene===3)home();
if(scene===4)ending();

particles=particles.filter(p=>p.life>0);
particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.vy+=.15;
p.life--;
rect(p.x,p.y,5,5,"#facc15");
});

requestAnimationFrame(loop);
}

stats();
dialog("體驗教授從早晨上課、下午研究，到游泳與回家休息的一天。");
buttons([["開始教授的一天 ▶",startGame]]);
requestAnimationFrame(loop);

</script>
</body>
</html>
